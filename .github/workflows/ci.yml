name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q .
      - name: Check backend imports
        run: python -c "import main; import engine; import agent.sensor; from capture.packet_capture import capture_engine; from federated.ieee_experiments import ExperimentConfig; from federated.research_summary import METRICS; from rag.evaluate_rag import DEFAULT_CASES; print(capture_engine.statistics()); print(ExperimentConfig()); print(len(METRICS), len(DEFAULT_CASES))"
      - name: Validate health and sensor routes
        run: python -c "from main import app; paths={r.path for r in app.routes}; assert '/health' in paths; assert '/health/live' in paths; assert '/health/ready' in paths; assert '/agents/health' in paths; assert '/agents/ingest' in paths"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
